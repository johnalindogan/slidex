[[permission]]
identifier = "allow-get-launch-paths"
description = "Allow frontend to read CLI/file-association launch paths"
commands.allow = ["get_launch_paths"]

[[permission]]
identifier = "allow-read-media-file"
description = "Allow reading bytes for allowlisted launch/dialog media paths"
commands.allow = ["read_media_file"]

[[permission]]
identifier = "allow-register-allowed-paths"
description = "Allow registering dialog-selected file paths for subsequent reads"
commands.allow = ["register_allowed_paths"]

[[permission]]
identifier = "allow-list-folder-media"
description = "Allow recursive media listing under a user-picked folder root"
commands.allow = ["list_folder_media"]

[[permission]]
identifier = "allow-read-text-file"
description = "Allow reading allowlisted text files (playlist JSON)"
commands.allow = ["read_text_file"]

[[permission]]
identifier = "allow-media-file-size"
description = "Allow probing allowlisted media file sizes for blob vs convertFileSrc ingest"
commands.allow = ["media_file_size"]

[[permission]]
identifier = "allow-open-playlist-window"
description = "Allow opening the undocked Media Manager playlist window"
commands.allow = ["open_playlist_window"]

[[permission]]
identifier = "allow-close-playlist-window"
description = "Allow closing the undocked Media Manager playlist window"
commands.allow = ["close_playlist_window"]

[[permission]]
identifier = "allow-focus-playlist-window"
description = "Allow focusing the undocked Media Manager playlist window"
commands.allow = ["focus_playlist_window"]

[[permission]]
identifier = "allow-playlist-log"
description = "Allow the page to append a short line to the Media Manager timing log"
commands.allow = ["playlist_log"]

[[permission]]
identifier = "allow-write-export-file"
description = "Allow writing graded image/video/sidecar exports to a user-chosen path"
commands.allow = ["write_export_file"]

[[permission]]
identifier = "allow-read-crop-sidecar"
description = "Allow reading a crop sidecar beside a media file or from app data"
commands.allow = ["read_crop_sidecar"]

[[permission]]
identifier = "allow-write-crop-sidecar"
description = "Allow writing a crop sidecar beside a media file, or app data if that folder is not writable"
commands.allow = ["write_crop_sidecar"]

[[permission]]
identifier = "allow-delete-crop-sidecar"
description = "Allow deleting a crop sidecar"
commands.allow = ["delete_crop_sidecar"]

[[permission]]
identifier = "allow-save-named-playlist"
description = "Allow saving a named playlist JSON in app data"
commands.allow = ["save_named_playlist"]

[[permission]]
identifier = "allow-list-named-playlists"
description = "Allow listing named playlists stored in app data"
commands.allow = ["list_named_playlists"]

[[permission]]
identifier = "allow-read-named-playlist"
description = "Allow reading a named playlist from app data"
commands.allow = ["read_named_playlist"]

[[permission]]
identifier = "allow-rename-named-playlist"
description = "Allow renaming a named playlist in app data"
commands.allow = ["rename_named_playlist"]

[[permission]]
identifier = "allow-delete-named-playlist"
description = "Allow deleting a named playlist from app data"
commands.allow = ["delete_named_playlist"]

[[permission]]
identifier = "allow-paths-exist"
description = "Allow checking whether file paths exist, without reading their contents"
commands.allow = ["paths_exist"]

[[permission]]
identifier = "allow-cast-discover"
description = "Allow mDNS discovery of Chromecast / Google TV devices on LAN"
commands.allow = ["cast_discover"]

[[permission]]
identifier = "allow-cast-network-fingerprint"
description = "Allow reading the home-LAN adapter fingerprint so Cast can rescan when it changes"
commands.allow = ["cast_network_fingerprint"]

[[permission]]
identifier = "allow-cast-connect"
description = "Allow connecting a Cast session to a LAN receiver"
commands.allow = ["cast_connect"]

[[permission]]
identifier = "allow-cast-set-playlist"
description = "Allow registering the open playlist for the Cast media server"
commands.allow = ["cast_set_playlist"]

[[permission]]
identifier = "allow-cast-load"
description = "Allow loading the current playlist item on the Cast receiver"
commands.allow = ["cast_load"]

[[permission]]
identifier = "allow-cast-pause"
description = "Allow pausing active cast media"
commands.allow = ["cast_pause"]

[[permission]]
identifier = "allow-cast-play"
description = "Allow resuming active cast media"
commands.allow = ["cast_play"]

[[permission]]
identifier = "allow-cast-disconnect"
description = "Allow clean cast disconnect and LAN HTTP teardown"
commands.allow = ["cast_disconnect"]

[[permission]]
identifier = "allow-cast-status"
description = "Allow reading cast playback status, including TV-remote pause"
commands.allow = ["cast_status"]

[[permission]]
identifier = "allow-cast-firewall-status"
description = "Allow reading whether the Private Cast firewall rules are installed"
commands.allow = ["cast_firewall_status"]

[[permission]]
identifier = "allow-cast-log-path"
description = "Allow copying the path of the size-capped Cast log"
commands.allow = ["cast_log_path"]

[[permission]]
identifier = "allow-cast-log-dur-fallback"
description = "Allow logging a saved image duration that is not a listed choice"
commands.allow = ["cast_log_dur_fallback"]

[[permission]]
identifier = "allow-cast-get-tv-encoder"
description = "Allow reading the TV-copy video encoder"
commands.allow = ["cast_get_tv_encoder"]

[[permission]]
identifier = "allow-cast-set-tv-encoder"
description = "Allow storing the TV-copy video encoder"
commands.allow = ["cast_set_tv_encoder"]

[[permission]]
identifier = "allow-slidex-save-done"
description = "Allow the page to ack a save before the window exits"
commands.allow = ["slidex_save_done"]
