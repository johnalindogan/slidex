[package]
name = "slideshowpro"
version = "0.1.9"
description = "Thin Tauri Windows wrapper for SlideX"
authors = ["johnalindogan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "slideshowpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
url = "2"
base64 = "0.22"
# Cast: Cast V2 + mDNS + LAN HTTP → Default Media Receiver. Not chrome.cast.
rust_cast = "0.21"
rustls = "0.23"
mdns-sd = "0.13"
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
