[package]
name = "slideshowpro"
version = "0.1.18"
description = "Thin Tauri Windows wrapper for SlideX"
authors = ["johnalindogan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "slideshowpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
url = "2"
base64 = "0.22"
# Cast: Cast V2 + mDNS + LAN HTTP → Default Media Receiver. Not chrome.cast.
rust_cast = "0.21"
rustls = "0.23"
mdns-sd = "0.13"
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Recycle-or-abort. Not the `trash` crate: that one can permanently delete.
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
# The `implement` macro names the `windows_core` crate, so it has to be a direct dependency.
windows-core = "0.61.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
